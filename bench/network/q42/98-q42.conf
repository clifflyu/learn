# Q42 实测用的 vhost：把 fastcgi_read_timeout 从镜像默认的 600s 改成 3s，
# 这样 504 不用等 10 分钟。跑完由 01-reproduce.sh 删除并重启 nginx。
#
# 用独立端口 8081，不碰原来的 80/443 vhost。
server {
    listen 8081;
    server_name _;

    root /app;
    index index.php;

    error_log /docker.stderr warn;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;

        fastcgi_connect_timeout 3s;     # 连不上上游 → 502
        fastcgi_send_timeout    3s;
        fastcgi_read_timeout    3s;     # 上游迟迟不回 → 504
    }
}
