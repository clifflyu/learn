# Q39 实测用的 HTTPS 站点。只在实验期间拷进容器 /etc/nginx/conf.d/，
# 跑完由 02-handshake.sh 删除并重启 nginx，不污染镜像原配置。
#
# 故意不复用镜像自带的 443 vhost：那张证书 notAfter=2025-05-01 已过期，
# 而且只有一张自签证书、没有中间 CA，演示不了证书链。
server {
    listen 8443 ssl;
    server_name q39.local localhost;

    root /app;
    index index.php;

    # leaf 在前、intermediate 在后。只写 leaf 的话客户端补不出链。
    ssl_certificate     /app/bench/network/tls/out/fullchain.crt;
    ssl_certificate_key /app/bench/network/tls/out/server.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:1m;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }
}
