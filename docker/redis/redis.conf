# 本地实验用 Redis 配置
# 挂载到容器内 /usr/local/etc/redis/redis.conf，改完 docker compose restart learn-redis 生效

# ---- 网络 ----
# 容器之间要通过服务名互访，所以监听所有网卡。
# 仅限本地开发：生产必须配合 requirepass / ACL，不要暴露到公网。
bind 0.0.0.0
protected-mode no
port 6379

# ---- 持久化 ----
# 数据目录，对应宿主机的 ./data/redis
dir /data
dbfilename dump.rdb

# RDB：N 秒内至少 M 次写就落盘一次。丢了最多这段时间的增量。
save 900 1
save 300 10
save 60 10000

# AOF：默认关闭。做 Q27 对比实验时改成 yes，
# 再 docker compose restart learn-redis 就能看到 appendonlydir/ 出现在 ./data/redis 下。
appendonly no
appendfilename "appendonly.aof"
appenddirname "appendonlydir"
# everysec 是性能与安全的折中：最多丢 1 秒数据
appendfsync everysec
# AOF 重写期间不 fsync，避免重写阻塞写入
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# ---- 内存 ----
# 本地不限内存；生产要设 maxmemory 并选好淘汰策略，
# 否则 Redis 会把机器内存吃满被 OOM Killer 干掉。
# maxmemory 2gb
# maxmemory-policy allkeys-lru

# ---- 慢日志 ----
# 超过 10ms 的命令记入慢日志（redis-cli SLOWLOG GET 查看）
slowlog-log-slower-than 10000
slowlog-max-len 128

# ---- 其他 ----
# 大 key / 热 key 排查常用：redis-cli --bigkeys / --hotkeys
# 危险命令（KEYS、FLUSHALL）生产环境建议 rename-command 禁用
# rename-command KEYS ""
